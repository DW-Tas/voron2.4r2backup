[gcode_macro QUAD_GANTRY_LEVEL]
rename_existing: _QUAD_GANTRY_LEVEL
gcode:
    RESPOND MSG="Starting Coarse QGL..."
    _QUAD_GANTRY_LEVEL HORIZONTAL_MOVE_Z=10 RETRY_TOLERANCE=1.0 RETRIES=5

    RESPOND MSG="Starting Fine QGL (No Lift)..."
    _QUAD_GANTRY_LEVEL HORIZONTAL_MOVE_Z=2 RETRY_TOLERANCE=0.0075 RETRIES=5

    G28 Z


####################################################################################
##                   Service Area Movement Macros
####################################################################################

[gcode_macro _SERVICE_AREA]
variable_minimum_z: 2.0
variable_rear_boundary_y: 301.0
variable_purge_x: 40.0
variable_purge_y: 309.0
variable_heating_entry_x: 75.0
variable_heating_pad_x: 94.0
variable_heating_pad_y: 308.0
variable_brush_left_x: 103.0
variable_brush_right_x: 133.0
variable_brush_y_min: 305.0
variable_brush_y_max: 308.0
variable_post_clean_x: 140.0
variable_travel_speed: 18000
variable_rear_speed: 9000
variable_service_speed: 3000
variable_brush_speed: 30000
variable_z_speed: 1200
gcode:

[gcode_macro MOVE_TO_PRE_PURGE]
description: Safely move to the Goose purge staging position
gcode:
  {% set config = printer["gcode_macro _SERVICE_AREA"] %}
  {% set toolhead = printer.toolhead %}
  {% if "xyz" not in toolhead.homed_axes %}
    {action_raise_error("MOVE_TO_PRE_PURGE requires all axes to be homed")}
  {% else %}
    SAVE_GCODE_STATE NAME=STATE_MOVE_TO_PRE_PURGE
    G90
    {% if toolhead.position.z < config.minimum_z %}
      G0 Z{config.minimum_z} F{config.z_speed}
    {% endif %}
    {% if toolhead.position.y > config.rear_boundary_y %}
      G0 Y{config.rear_boundary_y} F{config.rear_speed}
    {% endif %}
    G0 X{config.purge_x} Y{config.rear_boundary_y} F{config.travel_speed}
    RESTORE_GCODE_STATE NAME=STATE_MOVE_TO_PRE_PURGE MOVE=0
  {% endif %}

[gcode_macro MOVE_TO_HEATING_PAD]
description: Safely move to the rear nozzle heating pad, optionally at Z height
gcode:
  {% set config = printer["gcode_macro _SERVICE_AREA"] %}
  {% set toolhead = printer.toolhead %}
  {% set has_z = "Z" in params %}
  {% set target_z = params.Z|default(config.minimum_z)|float %}
  {% set at_purge = toolhead.position.x >= config.purge_x - 1.0 and toolhead.position.x <= config.purge_x + 1.0 and toolhead.position.y >= config.purge_y - 1.0 %}
  {% set at_pad = toolhead.position.x >= config.heating_pad_x - 1.0 and toolhead.position.x <= config.heating_pad_x + 1.0 and toolhead.position.y >= config.heating_pad_y - 1.0 %}
  {% if "xyz" not in toolhead.homed_axes %}
    {action_raise_error("MOVE_TO_HEATING_PAD requires all axes to be homed")}
  {% elif has_z and (target_z < config.minimum_z or target_z > toolhead.axis_maximum.z) %}
    {action_raise_error("MOVE_TO_HEATING_PAD Z must be between %.1f and %.1f" % (config.minimum_z, toolhead.axis_maximum.z))}
  {% else %}
    SAVE_GCODE_STATE NAME=STATE_MOVE_TO_HEATING_PAD
    G90
    {% if has_z and target_z > toolhead.position.z %}
      G0 Z{target_z} F{config.z_speed}
    {% elif not has_z and toolhead.position.z < config.minimum_z %}
      G0 Z{config.minimum_z} F{config.z_speed}
    {% endif %}
    {% if not at_pad %}
      {% if at_purge %}
        G0 X{config.heating_pad_x} Y{config.heating_pad_y} F{config.rear_speed}
      {% else %}
        {% if toolhead.position.y > config.rear_boundary_y %}
          G0 Y{config.rear_boundary_y} F{config.rear_speed}
        {% endif %}
        G0 X{config.heating_entry_x} Y{config.rear_boundary_y} F{config.travel_speed}
        G0 Y{config.heating_pad_y} F{config.rear_speed}
        G0 X{config.heating_pad_x} F{config.service_speed}
      {% endif %}
    {% endif %}
    {% if has_z and target_z < toolhead.position.z %}
      G0 Z{target_z} F{config.z_speed}
    {% endif %}
    RESTORE_GCODE_STATE NAME=STATE_MOVE_TO_HEATING_PAD MOVE=0
  {% endif %}

[gcode_macro CLEAN_NOZZLE_BRUSH]
description: Clean the nozzle on the rear silicone brush and exit safely
gcode:
  {% set config = printer["gcode_macro _SERVICE_AREA"] %}
  {% set brush_y_min = (config.brush_y_min * 10)|int %}
  {% set brush_y_max = (config.brush_y_max * 10)|int %}
  {% set brush_y = (range(brush_y_min, brush_y_max + 1)|random) / 10.0 %}
  {% if "xyz" not in printer.toolhead.homed_axes %}
    {action_raise_error("CLEAN_NOZZLE_BRUSH requires all axes to be homed")}
  {% else %}
    SAVE_GCODE_STATE NAME=STATE_CLEAN_NOZZLE_BRUSH
    MOVE_TO_HEATING_PAD
    G90
    G0 X{config.brush_left_x} Y{brush_y} F{config.service_speed}
    G0 X{config.brush_right_x} F{config.brush_speed}
    G0 X{config.brush_left_x} F{config.brush_speed}
    G0 X{config.brush_right_x} F{config.brush_speed}
    G0 X{config.brush_left_x} F{config.brush_speed}
    G0 X{config.brush_right_x} F{config.brush_speed}
    G0 X{config.brush_left_x} F{config.brush_speed}
    G0 X{config.brush_right_x} F{config.brush_speed}        
    G0 X{config.post_clean_x} Y{config.brush_y_max} F{config.brush_speed}
    G0 Y{config.rear_boundary_y} F{config.rear_speed}
    RESTORE_GCODE_STATE NAME=STATE_CLEAN_NOZZLE_BRUSH MOVE=0
  {% endif %}



####################################################################################
##                   Print control Macros
####################################################################################

[gcode_macro PRINT_START]
gcode:
  {% set target_bed = params.BED|int %}                  # Target bed temperature
  {% set target_extruder = params.EXTRUDER|int %}        # Target nozzle temperature
  {% set x_wait = printer.toolhead.axis_maximum.x|float / 2 %}  # Bed center X
  {% set y_wait = printer.toolhead.axis_maximum.y|float / 2 %}  # Bed center Y
  {% set chambertemp = params.CHAMBER|default(0)|int %}

  #ED_PRINTING

  SET_GCODE_OFFSET Z=0                                   # Reset Z offset
  G28                                                    # Home all axes
  G90                                                    # Set to absolute positioning

  M106 S128                                               # Turn fans on to 50%

  STATUS_HEATING
  SET_DISPLAY_TEXT MSG="Heating chamber:  {chambertemp}°C"
    {% if printer["temperature_sensor Chamber"].temperature < chambertemp %}                 ; - if chamber is not at temp yet:
        MOVE_TO_HEATING_PAD Z=40
        M190 S{target_bed+10}                                                                ;   wait for bed final temp
        TEMPERATURE_WAIT SENSOR="temperature_sensor Chamber" MINIMUM={chambertemp}           ;   wait for chamber final temp
        G0 X150 F3000
    {% endif %}
  
  SET_DISPLAY_TEXT MSG="Heating Bed: {target_bed}°C"     # Display bed heating message
  M104 S150                                              # Preheat extruder to 150c. Don't wait.
  M190 S{target_bed}                                     # Wait for bed to reach target temperature
  SET_DISPLAY_TEXT MSG="Leveling..."                     # Display leveling message
  QUAD_GANTRY_LEVEL                                          # Perform QGL
  
  SET_DISPLAY_TEXT MSG="Bed Mesh Calibration"            # Display mesh calibration message
  BED_MESH_CALIBRATE #ADAPTIVE=1                         # Perform bed mesh calibration

  SET_DISPLAY_TEXT MSG="Calibrating Z Offset"            # Display Z offset calibration message
  MOVE_TO_HEATING_PAD
  CLEAN_NOZZLE_BRUSH                                     # Clean the nozzle on the rear silicone brush
  CARTOGRAPHER_TOUCH_HOME                                # Calibrate Z offset

  SET_DISPLAY_TEXT MSG="Heating Nozzle: {target_extruder}°C" # Display nozzle heating message
  MOVE_TO_HEATING_PAD Z=40
  M106 S26                                               # Turn fans down to 10%
  M109 S{target_extruder}                                # Heat nozzle to target temperature

  SET_DISPLAY_TEXT MSG="Purging/Cleaning Nozzle..."                # Display priming message
  GOOSE_PURGE                                               # Purge the nozzle
  G0 Z0.6 F1200
  CLEAN_NOZZLE_BRUSH                                        # Clean the nozzle on the rear silicone brush
  
  SET_DISPLAY_TEXT MSG="Preparing to Print..."           # Display preparation message
  STATUS_CLEANING                                         # Set LED status to cleaning
  SET_DISPLAY_TEXT MSG="Printing"                        # Display end message

[gcode_macro PRINT_START_PRIME]
gcode:
  G90
  G0 X300 Y250 Z0.7 F10000                                 # Move to primeline start point  
  G91                                                    # Switch to relative positioning
  G1 E6.5 F3600                                          # de-retract filament from previous print end
  G1 Y-100 E30 F1000                                      # Extrude primeline
  G90                                                    # Switch back to absolute positioning


#--------------------------------------------------------------------
[gcode_macro PRINT_END]
gcode:
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [th.position.z + 20, th.axis_maximum.z]|min %}
    
    SAVE_GCODE_STATE NAME=STATE_PRINT_END

    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-1 F300                    ; retract filament
    
    TURN_OFF_HEATERS
    SET_NOZZLE_LEDS_OFF
    
    G90                                      ; absolute positioning
    G0 X{x_safe} Y{y_safe} Z{z_safe} F20000  ; move nozzle to remove stringing
    G0 X{th.axis_maximum.x//2} Y{th.axis_minimum.y + 1} F3600  ; park nozzle at front
    M84                                      ; turn off steppers
    SET_FAN_SPEED FAN=CPAP SPEED=0
    SET_FAN_SPEED FAN=Bed_Fans SPEED=0
    M106 S128                                ; set fan speed to 50%
    G4 P10000                                ; Pause for 10 seconds to let the fan continue to blow on the nozzle while cooling starts
    M107                                     ; turn off fan
    SET_DISPLAY_TEXT MSG="Print complete"    ; Display end message
    BED_MESH_CLEAR
    # The purpose of the SAVE_GCODE_STATE/RESTORE_GCODE_STATE
    # command pair is to restore the printer's coordinate system
    # and speed settings since the commands above change them.
    # However, to prevent any accidental, unintentional toolhead
    # moves when restoring the state, explicitly set MOVE=0.
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END MOVE=0
#--------------------------------------------------------------------
[gcode_macro PAUSE]
description: Pause the actual running print
rename_existing: PAUSE_BASE
# change this if you need more or less extrusion
variable_extrude: 1.0
gcode:
  ##### read E from pause macro #####
  {% set E = printer["gcode_macro PAUSE"].extrude|float %}
  ##### set park positon for x and y #####
  # default is your max posion from your printer.cfg
  {% set x_park = printer.toolhead.axis_maximum.x|float - 5.0 %}
  {% set y_park = printer.toolhead.axis_maximum.y|float - 5.0 %}
  ##### calculate save lift position #####
  {% set max_z = printer.toolhead.axis_maximum.z|float %}
  {% set act_z = printer.toolhead.position.z|float %}
  {% if act_z < (max_z - 2.0) %}
      {% set z_safe = 2.0 %}
  {% else %}
      {% set z_safe = max_z - act_z %}
  {% endif %}
  ##### end of definitions #####
  PAUSE_BASE
  G91
  {% if printer.extruder.can_extrude|lower == 'true' %}
    G1 E-{E} F2100
  {% else %}
    {action_respond_info("Extruder not hot enough")}
  {% endif %}
  {% if "xyz" in printer.toolhead.homed_axes %}
    G1 Z{z_safe} F900
    G90
    G1 X{x_park} Y{y_park} F6000
  {% else %}
    {action_respond_info("Printer not homed")}
  {% endif %} 
#--------------------------------------------------------------------
[gcode_macro RESUME]
description: Resume the actual running print
rename_existing: RESUME_BASE
gcode:
  ##### read E from pause macro #####
  {% set E = printer["gcode_macro PAUSE"].extrude|float %}
  #### get VELOCITY parameter if specified ####
  {% if 'VELOCITY' in params|upper %}
    {% set get_params = ('VELOCITY=' + params.VELOCITY)  %}
  {%else %}
    {% set get_params = "" %}
  {% endif %}
  ##### end of definitions #####
  {% if printer.extruder.can_extrude|lower == 'true' %}
    G91
    G1 E{E} F2100
  {% else %}
    {action_respond_info("Extruder not hot enough")}
  {% endif %}  
  RESUME_BASE {get_params}
#--------------------------------------------------------------------

[gcode_macro CANCEL_PRINT]
# Defines a G-code macro to cancel the actual running print
description = Cancel the actual running print
rename_existing = CANCEL_PRINT_BASE
variable_park = True
gcode = 
    G91                                       # Set to relative positioning
    G0 Z2 F900                                # Lift Z by 2mm
    G1 E-1 F300                               # Retract filament
    G90                                       # Set to absolute positioning
    G0 X300 Y302 F6000                        # Move out of the way
    _TOOLHEAD_PARK_PAUSE_CANCEL               # Call _TOOLHEAD_PARK_PAUSE_CANCEL macro
    TURN_OFF_HEATERS                          # Turn off all heaters
    CANCEL_PRINT_BASE                         # Call CANCEL_PRINT_BASE to cancel print
    M106 S0                                   # turn off fan
    SET_FAN_SPEED FAN=CPAP SPEED=0.29
    SET_FAN_SPEED FAN=Bed_Fans SPEED=1
    M84                                       # Disable motors
    SET_DISPLAY_TEXT MSG="Print cancelled"    # Display end message
#--------------------------------------------------------------------

####################################################################################
##                   Preheat Macros
####################################################################################
[gcode_macro PREHEAT_ABS]
gcode:
  SET_PIN PIN=Chamber_Lights VALUE=1.0
  STATUS_HEATING
  SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=115
  SET_FAN_SPEED FAN=CPAP SPEED=0.29
  SET_FAN_SPEED FAN=Bed_Fans SPEED=1
  M106 S77                  ; turn on fan at 30%
  G28                       ; home all
  G90                       ; absolute positioning
  MOVE_TO_HEATING_PAD Z=40

[gcode_macro PREHEAT_PET]
gcode:
  SET_PIN PIN=Chamber_Lights VALUE=1.0
  STATUS_HEATING
  SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=80
  SET_FAN_SPEED FAN=CPAP SPEED=0.29
  SET_FAN_SPEED FAN=Bed_Fans SPEED=1
  M106 S77                  ; turn on fan at 30%
  G28                       ; home all
  G90                       ; absolute positioning
  MOVE_TO_HEATING_PAD Z=40

####################################################################################
##                   Klipper-Backup Macros
####################################################################################
[gcode_macro update_git]
gcode:
  RUN_SHELL_COMMAND CMD=update_git_script

[delayed_gcode update_git_on_restart]
initial_duration: 1.0
gcode:
    RUN_SHELL_COMMAND CMD=update_git_script

[gcode_shell_command update_git_script]
command: bash -c "bash $HOME/klipper-backup/script.sh"
timeout: 90.0
verbose: True
